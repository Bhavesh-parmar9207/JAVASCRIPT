        // Event propagation => bubbling(default = false | Majorly used) and capturing





        document.querySelector('#images').addEventListener('click', function (e) {
                console.log(e);
                console.log(e.target.parentNode) //=> to get whole li of that clicked photo
                console.log(e.target.tagName) //=> to get clicked tag name
                if (e.target.tagName == 'IMG') {
                        console.log(e.target.id);

                        let removeIt = (e.target.parentNode);
                        removeIt.remove();
                }

        })
