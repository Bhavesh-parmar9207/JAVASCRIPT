<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>

<body style="background-color: black; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    // function addLanguage(langName) {
    //     const li = document.createElement('li')
    //     li.innerHTML = `${langName}`
    //     document.querySelector('.language').appendChild(li)
    // }
    // addLanguage("Python")
    // addLanguage("Java")
    // addLanguage("C++")
    // with this way it will hard to store because it traverse the tree every time 
    // which give problem on large number of entries which gives optimise issue in real world projects


    function addOptiLang(langName) {
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))//create new nodes
        document.querySelector('.language').appendChild(li)

    }
    addOptiLang("Python")
    addOptiLang("Java")
    addOptiLang("C++")


    //edit in dom   
    const secondLang = document.querySelector("li:nth-child(2)")
    
    // secondLang.innerHTML = "typescript" => it's not optimised approach 
    console.log(secondLang);
    const newLang = document.createElement("li")//create li
    newLang.textContent = "typescript"
    secondLang.replaceWith(newLang)

    // //edit with outerHTML
    const fistLang = document.querySelector("li:first-child")
    fistLang.outerHTML = `<li>Typescript</li>`

    // //remove element
    const lastLang = document.querySelector("li:last-child")
    lastLang.remove()

</script>

</html>
