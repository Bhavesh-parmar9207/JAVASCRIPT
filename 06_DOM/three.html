<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavesh</title>
</head>

<body style="background-color: black; color: #fff;">

</body>
<script>
    //random id
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10)//by default function
    //for custom attribute set
    div.setAttribute("title", "generated title")
    //styling
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Bhavesh" //gives name text to div
    //attaching
    const addText = document.createTextNode("bhavesh ")
    div.appendChild(addText)
    document.body.appendChild(div)



</script>

</html>
